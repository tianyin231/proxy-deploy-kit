name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  verify-kit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax on all scripts
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Run topology renderer self-test
        run: python3 scripts/render-topology.py --selftest

      - name: Run offline sandbox deployment & rollback test suite
        run: ./scripts/test-deploy.sh
