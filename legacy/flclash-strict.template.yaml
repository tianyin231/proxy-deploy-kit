# 模板文件：导入前请将所有 <PLACEHOLDER> 替换为实际值。
# 本文件已去除真实服务器 IP、UUID、密码、Reality 公钥/short-id 与 HY2 证书指纹。
# FlClash / Mihomo 严格防泄露双场景配置（仅 正常代理 / Google 两个组）
# 平时用：「正常代理」选海外节点 → 国内白名单+国内纯IP直连，其余海外与Google均锁死节点、故障立刻断连
# 公司用：「正常代理」选末尾 DIRECT → 仅 Google 锁死代理，其余非谷歌流量(含ChatGPT/公司服务器)走公司出口+无污染DNS
# 国内域名白名单：pluwen/china-domain-allowlist 精洗版（1,199 条）；国内 IP 段：Loyalsoldier cncidr (no-resolve)

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: always
profile:
  store-selected: true
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - localhost.ptlogin2.qq.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  nameserver:
  - https://1.1.1.1/dns-query#正常代理
  - https://9.9.9.9/dns-query#正常代理
  nameserver-policy:
    "rule-set:google-extra,google,google-gemini,youtube":
    - https://8.8.8.8/dns-query#Google
    - https://8.8.4.4/dns-query#Google
    "rule-set:cn-allowlist,private":
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT
    "+.lan": system
    "+.local": system
  fallback: []
proxies:
- name: 出口A｜VLESS
  type: vless
  server: <TRANSIT_SERVER_IP>
  port: 443
  uuid: <VLESS_UUID_EXIT_A>
  network: tcp
  udp: false
  tls: true
  flow: xtls-rprx-vision
  servername: www.cloudflare.com
  client-fingerprint: chrome
  reality-opts:
    public-key: <REALITY_PUBLIC_KEY>
    short-id: <REALITY_SHORT_ID>
- name: 出口A｜HY2
  type: hysteria2
  server: <TRANSIT_SERVER_IP>
  port: 443
  password: <HY2_PASSWORD_EXIT_A>
  fingerprint: <HY2_CERT_PIN_SHA256>
  sni: <HY2_CERT_SAN>
  skip-cert-verify: false
  udp: false
- name: 出口B｜VLESS
  type: vless
  server: <TRANSIT_SERVER_IP>
  port: 443
  uuid: <VLESS_UUID_EXIT_B>
  network: tcp
  udp: false
  tls: true
  flow: xtls-rprx-vision
  servername: www.cloudflare.com
  client-fingerprint: chrome
  reality-opts:
    public-key: <REALITY_PUBLIC_KEY>
    short-id: <REALITY_SHORT_ID>
- name: 出口B｜HY2
  type: hysteria2
  server: <TRANSIT_SERVER_IP>
  port: 443
  password: <HY2_PASSWORD_EXIT_B>
  fingerprint: <HY2_CERT_PIN_SHA256>
  sni: <HY2_CERT_SAN>
  skip-cert-verify: false
  udp: false
- name: 出口C｜VLESS
  type: vless
  server: <TRANSIT_SERVER_IP>
  port: 443
  uuid: <VLESS_UUID_EXIT_C>
  network: tcp
  udp: false
  tls: true
  flow: xtls-rprx-vision
  servername: www.cloudflare.com
  client-fingerprint: chrome
  reality-opts:
    public-key: <REALITY_PUBLIC_KEY>
    short-id: <REALITY_SHORT_ID>
- name: 出口C｜HY2
  type: hysteria2
  server: <TRANSIT_SERVER_IP>
  port: 443
  password: <HY2_PASSWORD_EXIT_C>
  fingerprint: <HY2_CERT_PIN_SHA256>
  sni: <HY2_CERT_SAN>
  skip-cert-verify: false
  udp: false
- name: 出口D｜VLESS
  type: vless
  server: <TRANSIT_SERVER_IP>
  port: 443
  uuid: <VLESS_UUID_EXIT_D>
  network: tcp
  udp: false
  tls: true
  flow: xtls-rprx-vision
  servername: www.cloudflare.com
  client-fingerprint: chrome
  reality-opts:
    public-key: <REALITY_PUBLIC_KEY>
    short-id: <REALITY_SHORT_ID>
- name: 出口D｜HY2
  type: hysteria2
  server: <TRANSIT_SERVER_IP>
  port: 443
  password: <HY2_PASSWORD_EXIT_D>
  fingerprint: <HY2_CERT_PIN_SHA256>
  sni: <HY2_CERT_SAN>
  skip-cert-verify: false
  udp: false
proxy-groups:
- name: 正常代理
  type: select
  proxies:
  - 出口B｜VLESS
  - 出口B｜HY2
  - 出口C｜VLESS
  - 出口C｜HY2
  - 出口A｜VLESS
  - 出口A｜HY2
  - 出口D｜VLESS
  - 出口D｜HY2
  - DIRECT
- name: Google
  type: select
  proxies:
  - 出口A｜VLESS
  - 出口A｜HY2
  - 出口D｜VLESS
  - 出口D｜HY2
  - 出口B｜VLESS
  - 出口B｜HY2
  - 出口C｜VLESS
  - 出口C｜HY2
